<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Köyünü seç</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F4F6F0;color:#14392B;font-family:'Manrope',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 12px 0">
    <a href="Konum.dc.html" aria-label="Geri" style="width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <div style="font-size:16px;font-weight:800;color:#3E5247;padding-right:12px">Adım 1 / 2</div>
  </div>

  <sc-if value="{{ isIl }}" hint-placeholder-val="{{ true }}">
    <div style="padding:4px 20px 0;font-size:30px;font-weight:800">Hangi ilde?</div>
    <div style="display:flex;flex-direction:column;gap:10px;padding:18px 20px 0">
      <button onClick="{{ pickIl }}" style="min-height:64px;border-radius:20px;border:1px solid #CBD5C3;background:#FFFFFF;color:#14392B;font-family:inherit;font-size:20px;font-weight:800;text-align:left;padding:0 20px">Gaziantep</button>
      <button onClick="{{ pickIl }}" style="min-height:64px;border-radius:20px;border:1px solid #CBD5C3;background:#FFFFFF;color:#14392B;font-family:inherit;font-size:20px;font-weight:800;text-align:left;padding:0 20px">Şanlıurfa</button>
      <button onClick="{{ pickIl }}" style="min-height:64px;border-radius:20px;border:1px solid #CBD5C3;background:#FFFFFF;color:#14392B;font-family:inherit;font-size:20px;font-weight:800;text-align:left;padding:0 20px">Adıyaman</button>
      <button onClick="{{ pickIl }}" style="min-height:64px;border-radius:20px;border:1px solid #CBD5C3;background:#FFFFFF;color:#14392B;font-family:inherit;font-size:20px;font-weight:800;text-align:left;padding:0 20px">Kilis</button>
    </div>
    <div style="padding:14px 20px 0;font-size:16px;color:#3E5247;font-weight:600">Başka il için: sesle söyle ya da yaz.</div>
  </sc-if>

  <sc-if value="{{ isIlce }}" hint-placeholder-val="{{ false }}">
    <div style="padding:4px 20px 0;font-size:16px;color:#3E5247;font-weight:700">Gaziantep</div>
    <div style="padding:2px 20px 0;font-size:30px;font-weight:800">Hangi ilçe?</div>
    <div style="display:flex;flex-direction:column;gap:10px;padding:18px 20px 0">
      <button onClick="{{ pickIlce }}" style="min-height:64px;border-radius:20px;border:1px solid #CBD5C3;background:#FFFFFF;color:#14392B;font-family:inherit;font-size:20px;font-weight:800;text-align:left;padding:0 20px">Nizip</button>
      <button onClick="{{ pickIlce }}" style="min-height:64px;border-radius:20px;border:1px solid #CBD5C3;background:#FFFFFF;color:#14392B;font-family:inherit;font-size:20px;font-weight:800;text-align:left;padding:0 20px">Şahinbey</button>
      <button onClick="{{ pickIlce }}" style="min-height:64px;border-radius:20px;border:1px solid #CBD5C3;background:#FFFFFF;color:#14392B;font-family:inherit;font-size:20px;font-weight:800;text-align:left;padding:0 20px">Araban</button>
      <button onClick="{{ pickIlce }}" style="min-height:64px;border-radius:20px;border:1px solid #CBD5C3;background:#FFFFFF;color:#14392B;font-family:inherit;font-size:20px;font-weight:800;text-align:left;padding:0 20px">Karkamış</button>
    </div>
  </sc-if>

  <sc-if value="{{ isKoy }}" hint-placeholder-val="{{ false }}">
    <div style="padding:4px 20px 0;font-size:16px;color:#3E5247;font-weight:700">Gaziantep · Nizip</div>
    <div style="padding:2px 20px 0;font-size:30px;font-weight:800">Hangi köy?</div>
    <div style="display:flex;flex-direction:column;gap:10px;padding:18px 20px 0">
      <a href="Harita.dc.html" style="min-height:64px;border-radius:20px;border:1px solid #CBD5C3;background:#FFFFFF;display:flex;align-items:center;font-size:20px;font-weight:800;padding:0 20px">Burç Köyü</a>
      <a href="Harita.dc.html" style="min-height:64px;border-radius:20px;border:1px solid #CBD5C3;background:#FFFFFF;display:flex;align-items:center;font-size:20px;font-weight:800;padding:0 20px">Örnek Köy 2</a>
      <a href="Harita.dc.html" style="min-height:64px;border-radius:20px;border:1px solid #CBD5C3;background:#FFFFFF;display:flex;align-items:center;font-size:20px;font-weight:800;padding:0 20px">Örnek Köy 3</a>
    </div>
    <div style="padding:14px 20px 0;font-size:16px;color:#3E5247;font-weight:600">Listede yoksa adını yaz ya da sesle söyle.</div>
  </sc-if>

  <div style="flex:1"></div>

  <div style="display:flex;gap:10px;padding:0 20px 24px">
    <button style="flex:1;min-height:60px;border-radius:30px;border:1px solid #14392B;background:#FFFFFF;color:#14392B;font-family:inherit;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Sesle söyle</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { step: 'il' };
  renderVals() {
    const s = this.state.step;
    return {
      isIl: s === 'il',
      isIlce: s === 'ilce',
      isKoy: s === 'koy',
      pickIl: () => this.setState({ step: 'ilce' }),
      pickIlce: () => this.setState({ step: 'koy' })
    };
  }
}
</script>
</body>
</html>
