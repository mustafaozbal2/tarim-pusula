name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tarim/e2e exec playwright install --with-deps chromium
      - run: pnpm run verify
      - run: pnpm --filter @tarim/mobile run export:web

  integration:
    # Gerçek PostgreSQL+PostGIS+pgvector, Redis ve ACL'li Mosquitto'ya karşı (G15).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run infra:test
      - run: pnpm run test:integration

  deploy:
    # dev dalına gönderilen her commit, testler geçince kendiliğinden yayınlanır:
    # canlı sunucu (Render: API + web) ve mobil kod değiştiyse telefonlara EAS Update.
    # Gerekli GitHub sırları: RENDER_API_KEY, EXPO_TOKEN (yoksa ilgili adım atlanır).
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    concurrency: deploy-dev
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Canlı sunucu (Render)
        if: env.RENDER_API_KEY != ''
        run: |
          for svc in srv-dbfib88473hc73daa610 srv-dbfig7avcj2c7389lasg; do
            curl -fsS -X POST "https://api.render.com/v1/services/$svc/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" -H 'Content-Type: application/json' \
              -d "{\"commitId\":\"$GITHUB_SHA\",\"clearCache\":\"do_not_clear\"}" > /dev/null
            echo "kurulum başladı: $svc"
          done
      - name: Mobil kod değişti mi
        id: mobil
        run: |
          before='${{ github.event.before }}'
          if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then echo "degisti=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$before" "$GITHUB_SHA" | grep -qE '^(apps/mobile|packages)/'; then
            echo "degisti=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.mobil.outputs.degisti == '1' && env.EXPO_TOKEN != ''
      - uses: actions/setup-node@v4
        if: steps.mobil.outputs.degisti == '1' && env.EXPO_TOKEN != ''
        with:
          node-version: 24
          cache: pnpm
      - name: Telefonlara güncelleme (EAS Update)
        if: steps.mobil.outputs.degisti == '1' && env.EXPO_TOKEN != ''
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://tarim-pusula-api.onrender.com
        run: |
          pnpm install --frozen-lockfile
          msg="$(git log -1 --pretty=%s | tr -d '\";' | cut -c1-80)"
          npx --yes eas-cli@latest update --channel preview --environment preview --message "$msg" --non-interactive
