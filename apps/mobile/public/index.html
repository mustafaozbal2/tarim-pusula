<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#4DB4B5" />
    <meta name="description" content="Bilinçli Tarım, Verimli Üretim" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        background: #e4e8dc;
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>Bu uygulama için tarayıcıda JavaScript açık olmalı.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function () {
              return navigator.serviceWorker.ready;
            })
            .then(function (reg) {
              var send = function () {
                var urls = performance.getEntriesByType('resource').map(function (e) {
                  return e.name;
                });
                if (reg.active) reg.active.postMessage({ type: 'precache', urls: urls });
              };
              // Sayfa yüklendikten sonra gelen (tembel) parçalar da kaçmasın: bir kez daha bildir.
              send();
              setTimeout(send, 2500);
            })
            .catch(function () {});
        });
      }
    </script>
  </body>
</html>
