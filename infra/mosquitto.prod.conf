# Üretim: yalnız TLS, kimlik zorunlu, konu ACL'i. Süreç içi aracıdaki (device-sim/broker.ts) kuralların aynısı.
# Sertifikalar ve parola dosyası depoda YOK: ortamda üretilir (mosquitto_passwd). Parola = HMAC türevi (protocol.ts mqttPasswordFor).
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate false

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Kalıcı oturum: cihaz kopukken biriken QoS 1 komutlar yeniden bağlanınca gelir (cihaz TTL'e bakar).
persistence true
persistence_location /mosquitto/data/
max_queued_messages 20
